name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 测试 Py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 安装
        run: pip install -e ".[dev]"
      - name: 单元测试
        run: python -m unittest discover -s tests -v

  vad:
    name: 断句算法
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: VAD 测试
        run: node tests/vad.test.mjs

  e2e:
    name: 端到端（假模型）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装
        run: pip install -e ".[dev]"
      - name: 启动服务
        run: |
          python examples/fake_llm.py 8799 &
          AULA_LLM_BASE_URL=http://127.0.0.1:8799/v1 AULA_LLM_MODEL=fake \
            aula --demo --port 8781 --data-dir /tmp/e2e &
          sleep 4
      - name: 健康检查与两个工作区
        run: |
          curl -fsS http://127.0.0.1:8781/api/health | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          curl -fsS -o /dev/null http://127.0.0.1:8781/
          curl -fsS -o /dev/null http://127.0.0.1:8781/reader
      - name: 全链路
        run: python examples/e2e_check.py 8781
